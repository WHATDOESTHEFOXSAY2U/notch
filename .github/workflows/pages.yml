# Publishes the Website folder to GitHub Pages on every push to main that changes it.
# The site is static: nothing is built, the folder is uploaded as it is.
name: pages

on:
  push:
    branches: [main]
    paths: ['Website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Website
      - id: deployment
        uses: actions/deploy-pages@v4
